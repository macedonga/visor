# The template that `android create` ships is several months behind, so these were taken
# from the Google and Maven Central release metadata on 2026-09-23 and are the latest
# stable of each. No alphas, betas or release candidates.

[versions]
androidGradlePlugin = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"

androidxCore = "1.19.0"
media3 = "1.8.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
androidxWebkit = "1.17.1"
androidxComposeBom = "2026.09.00"
nav3Core = "1.1.7"
lifecycleViewmodelNav3 = "2.11.0"
coroutines = "1.10.2"

# :core:identity only. scrypt is in no JCA provider on either platform and the bundle
# JSON has to stay readable by the desktop client. Both are argued in
# core/identity/build.gradle.kts. kotlinx-serialization 1.12.0-RC exists and is not
# used, per this file's own rule about release candidates.
bouncycastle = "1.86"
kotlinxSerialization = "1.11.0"

# :core:settings only: the glasses' contact objects are FlexBuffers maps, as the Meta app writes them.
flatbuffers = "25.2.10"

# :core:assistant only: the MCP servers' HTTP, cancellable mid-request and readable as an event stream.
okhttp = "5.5.0"

# :app only: an MCP server's OAuth sign-in in a Custom Tab.
androidxBrowser = "1.10.0"

# :app only: a music app's own search, which only the compat media browser can ask (issue #37).
androidxMedia = "1.7.0"

# :app only: the glasses on the home screen. 1.77.1 because 1.77.2 and .3 are under two weeks old.
filament = "1.77.1"

# The build only: patched versions of libraries the Android Gradle plugin and lint bring onto the build's own
# classpaths. Both settings.gradle.kts files hold every configuration to the pin-* libraries below.
jose4j = "0.9.6"
jdom2 = "2.0.6.1"
commonsLang3 = "3.21.0"
httpcomponents = "4.5.14"


# compileSdk and targetSdk track the current platform. minSdk is 29 and comes from the
# design: it is the floor for the L2CAP option on the Bluetooth transport.
compileSdk = "37"
targetSdk = "37"
minSdk = "29"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
androidx-media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }

androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidxWebkit" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
flatbuffers-java = { module = "com.google.flatbuffers:flatbuffers-java", version.ref = "flatbuffers" }
filament-android = { module = "com.google.android.filament:filament-android", version.ref = "filament" }
gltfio-android = { module = "com.google.android.filament:gltfio-android", version.ref = "filament" }

bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidxBrowser" }
androidx-media = { module = "androidx.media:media", version.ref = "androidxMedia" }


# Referenced by the build-logic convention plugins, which need these on their classpath
# rather than as project dependencies.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

# Pins, see [versions]. The Kotlin plugin is pinned because kotlin-dsl brings Gradle's own, older one into build-logic.
pin-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
pin-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
pin-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
pin-jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "jose4j" }
pin-jdom2 = { module = "org.jdom:jdom2", version.ref = "jdom2" }
pin-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }
pin-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "httpcomponents" }
pin-httpmime = { module = "org.apache.httpcomponents:httpmime", version.ref = "httpcomponents" }
pin-kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
