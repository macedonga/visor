name: Bug report
description: Something in Visor does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through the Security tab, not here. See SECURITY.md.
        Remove serial numbers, Bluetooth addresses, tokens and API keys from everything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Live view
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Visor version
      description: Settings, About.
    validations:
      required: true
  - type: input
    id: glasses
    attributes:
      label: Glasses and firmware
      placeholder: Ray-Ban Meta (Gen 2), 72387580077200100
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Pixel 9, Android 16
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Event log
      description: Settings, Advanced, Event log, Share. Paste the part around the problem.
      render: text
