# The iPhone app. Generate the Xcode project with `xcodegen` in this folder; it is not checked in.
name: Visor
options:
  bundleIdPrefix: com.macedonga
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Visor:
    type: application
    platform: iOS
    scheme: {}
    sources: [Visor]
    info:
      path: Visor/Info.plist
      properties:
        CFBundleDisplayName: Visor
        NSBluetoothAlwaysUsageDescription: Visor talks to your glasses over Bluetooth.
        UIBackgroundModes: [bluetooth-central]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macedonga.visor
        # VisorCore, the shared Kotlin, built by Gradle for this configuration and SDK.
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework VisorCore
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # VisorCore has no Intel simulator slice.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    preBuildScripts:
      - name: VisorCore
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
